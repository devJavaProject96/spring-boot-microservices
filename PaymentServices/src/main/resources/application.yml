server:
  port: 8082

spring:
  application:
    name: payment-service

  profiles:
    active: native

  cloud:
    config:
      server:
        native:
          search-locations: file:./config-repo

  datasource:
    url: jdbc:mysql://aws-practices.ctie8c4qkf6l.ap-southeast-2.rds.amazonaws.com:3306/order_db?sslMode=VERIFY_IDENTITY
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info